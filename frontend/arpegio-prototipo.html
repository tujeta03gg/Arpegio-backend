/* Arpegio — componentes. Todo valor sale de tokens.css (var(--…)); los tamaños de texto vienen de las clases de estilo (.body, .label…). */

.ar-root, .ar-root * { box-sizing: border-box; }
.ar-root { font-family: var(--font-display); color: var(--ink); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
:where(.ar-root) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
.ar-root :focus-visible { outline: none; box-shadow: var(--glow-focus); }
.ar-icon { display: block; flex: none; }
[data-icon] { display: inline-flex; }
.ar-ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ar-muted { color: var(--ink-muted); }
.ar-mono { font-family: var(--font-mono); }
.ar-root .label { text-transform: uppercase; }

/* Esquina cortada: la firma de Arpegio */
.ar-chamfer { clip-path: polygon(var(--chamfer-md) 0, 100% 0, 100% calc(100% - var(--chamfer-md)), calc(100% - var(--chamfer-md)) 100%, 0 100%, 0 var(--chamfer-md)); }
.ar-chamfer-sm { clip-path: polygon(var(--chamfer-sm) 0, 100% 0, 100% calc(100% - var(--chamfer-sm)), calc(100% - var(--chamfer-sm)) 100%, 0 100%, 0 var(--chamfer-sm)); }

/* Portada */
.ar-art { position: relative; overflow: hidden; background: var(--void-200); flex: none; }
.ar-art__svg { display: block; width: 100%; height: 100%; }
.ar-art--row { width: 40px; height: 40px; border-radius: var(--radius-sm); }
.ar-art--mini { width: 48px; height: 48px; border-radius: var(--radius-sm); }

/* App frame 800×480 */
.ar-app {
  width: 800px; height: 480px; position: relative; overflow: hidden;
  background: var(--void-000);
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  grid-template-rows: var(--statusbar-h) 1fr auto;
}
.ar-app > .ar-statusbar { grid-column: 1 / -1; }
.ar-app > .ar-rail { grid-column: 1; grid-row: 2; }
.ar-app > .ar-main { grid-column: 2; grid-row: 2; min-height: 0; overflow: hidden; position: relative; }
.ar-app > .ar-mini { grid-column: 1 / -1; grid-row: 3; }

/* StatusBar */
.ar-statusbar {
  height: var(--statusbar-h); display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-4); background: var(--void-100); border-bottom: 1px solid var(--void-300); color: var(--ink-muted);
}
.ar-statusbar__spacer { flex: 1; }
.ar-statusbar__item { display: inline-flex; align-items: center; gap: var(--space-1); }
.ar-dot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--signal-ok); flex: none; }
.ar-dot--warn { background: var(--neon-amber); }
.ar-dot--error { background: var(--signal-error); }

/* NavRail */
.ar-rail {
  width: var(--rail-w); background: var(--void-100); border-right: 1px solid var(--void-300);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); padding: var(--space-2) 0;
}
.ar-rail__item {
  width: 64px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1);
  color: var(--ink-muted);
}
.ar-rail__item:active { transform: scale(.96); }
.ar-rail__item[aria-current="page"] { color: var(--neon-cyan); background: var(--neon-cyan-wash); }
.ar-rail__item[aria-current="page"] .ar-icon { filter: drop-shadow(0 0 4px var(--neon-cyan)); }

/* Main screen scaffolding */
.ar-screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: var(--space-4) var(--space-4) var(--space-4); scrollbar-width: none; }
.ar-screen::-webkit-scrollbar { display: none; }
.ar-screen__head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }
.ar-section { margin: var(--space-6) 0 var(--space-2); color: var(--ink-muted); }
.ar-section:first-child { margin-top: 0; }

/* Buttons */
.ar-iconbtn {
  width: var(--touch-min); height: var(--touch-min); display: inline-flex; align-items: center; justify-content: center; position: relative;
  color: var(--ink); border-radius: var(--radius-pill); flex: none;
}
.ar-iconbtn:active { transform: scale(.92); background: var(--void-200); }
.ar-iconbtn--muted { color: var(--ink-muted); }
.ar-iconbtn[aria-pressed="true"] { color: var(--neon-magenta); }
.ar-iconbtn[aria-pressed="true"]::after {
  content: ""; position: absolute; bottom: 4px; left: 50%; width: 4px; height: 4px; margin-left: -2px; background: currentColor; border-radius: var(--radius-pill);
}
.ar-iconbtn[disabled] { color: var(--ink-dim); pointer-events: none; }
.ar-play {
  width: var(--touch-play); height: var(--touch-play); border-radius: var(--radius-pill); flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--neon-cyan); color: var(--on-neon); box-shadow: var(--glow-cyan);
  transition: transform 120ms ease-out;
}
.ar-play:active { transform: scale(.94); }
.ar-play--sm { width: var(--touch-min); height: var(--touch-min); box-shadow: none; }
.ar-btn {
  min-height: var(--touch-min); padding: 0 var(--space-4); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  background: var(--neon-cyan); color: var(--on-neon);
}
.ar-btn--ghost { background: var(--void-200); color: var(--ink); }
.ar-btn:active { transform: scale(.96); }

/* Transport */
.ar-transport { display: flex; align-items: center; justify-content: space-between; }
.ar-transport__main { display: flex; align-items: center; gap: var(--space-6); }

/* ProgressBar */
.ar-progress { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--space-3); color: var(--ink-muted); }
.ar-progress__track { position: relative; height: var(--touch-min); cursor: pointer; touch-action: none; --p: 0%; }
.ar-progress__rail, .ar-progress__fill {
  position: absolute; left: 0; top: 50%; height: var(--track-h); margin-top: calc(var(--track-h) / -2); border-radius: var(--radius-pill);
}
.ar-progress__rail { right: 0; background: var(--void-300); }
.ar-progress__fill { width: var(--p); background: var(--neon-cyan); }
.ar-progress__thumb {
  position: absolute; top: 50%; left: var(--p); width: 14px; height: 14px; margin: -7px 0 0 -7px;
  border-radius: var(--radius-pill); background: var(--neon-cyan); box-shadow: var(--glow-cyan);
}
.ar-progress--line { display: block; }
.ar-progress--line .ar-progress__track { height: 2px; cursor: default; }
.ar-progress--line .ar-progress__rail, .ar-progress--line .ar-progress__fill { height: 2px; margin-top: -1px; border-radius: 0; }

/* TrackRow */
.ar-track {
  width: 100%; height: var(--row-h); display: grid; grid-template-columns: 40px 1fr auto var(--touch-min); align-items: center; gap: var(--space-3);
  padding: 0 0 0 var(--space-2); text-align: left; border-bottom: 1px solid var(--void-300);
}
.ar-track:active { background: var(--void-200); }
.ar-track__text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ar-track__title { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.ar-track__time { color: var(--ink-muted); }
.ar-track.is-playing { background: var(--neon-cyan-wash); }
.ar-track.is-playing .ar-track__title { color: var(--neon-cyan); }

/* Equalizer (canción sonando) */
.ar-eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
.ar-eq i { display: block; width: 3px; height: 100%; background: currentColor; transform-origin: bottom; transform: scaleY(.35); }
.ar-eq.is-on i { animation: ar-eq 900ms ease-in-out infinite alternate; }
.ar-eq.is-on i:nth-child(2) { animation-delay: -300ms; animation-duration: 700ms; }
.ar-eq.is-on i:nth-child(3) { animation-delay: -600ms; animation-duration: 1100ms; }
.ar-eq.is-on i:nth-child(4) { animation-delay: -150ms; animation-duration: 800ms; }
@keyframes ar-eq { from { transform: scaleY(.2); } to { transform: scaleY(1); } }

/* MiniPlayer */
.ar-mini {
  height: var(--miniplayer-h); position: relative; display: grid; grid-template-columns: 48px 1fr auto auto; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-4) 0 calc(var(--space-4) + 4px); background: var(--void-100); border-top: 1px solid var(--void-300);
}
.ar-mini__open { display: contents; text-align: left; }
.ar-mini .ar-progress--line { position: absolute; left: 0; right: 0; top: -1px; }
.ar-mini__text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* AlbumCard */
.ar-card { width: 152px; padding: var(--space-2); background: var(--void-200); text-align: left; flex: none; display: flex; flex-direction: column; gap: var(--space-2); }
.ar-card:active { transform: scale(.97); }
.ar-card .ar-art { width: 136px; height: 136px; }
.ar-card__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 0 var(--space-1) var(--space-1); }
.ar-shelf { display: flex; gap: var(--space-3); overflow-x: auto; margin: 0 calc(var(--space-4) * -1); padding: 0 var(--space-4); scrollbar-width: none; }
.ar-shelf::-webkit-scrollbar { display: none; }

/* Chip */
.ar-chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.ar-chip {
  min-height: 36px; padding: 0 var(--space-3); display: inline-flex; align-items: center; gap: var(--space-1);
  background: var(--void-200); color: var(--ink-muted);
}
.ar-chip[aria-pressed="true"] { background: var(--neon-cyan); color: var(--on-neon); }

/* Search field */
.ar-field {
  height: var(--touch-min); display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3);
  background: var(--void-100); border: 1px solid var(--void-300); border-radius: var(--radius-sm); color: var(--ink-muted);
}
.ar-field:focus-within { border-color: var(--neon-cyan); color: var(--neon-cyan); }
.ar-field input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; color: var(--ink); font: inherit; }
.ar-field input:focus-visible { box-shadow: none; }
.ar-field input::placeholder { color: var(--ink-muted); }

/* Toggle */
.ar-toggle { display: flex; align-items: center; gap: var(--space-3); min-height: var(--row-h); width: 100%; text-align: left; border-bottom: 1px solid var(--void-300); }
.ar-toggle__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ar-switch { width: 44px; height: 24px; border-radius: var(--radius-pill); background: var(--void-300); position: relative; flex: none; transition: background 150ms; }
.ar-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: var(--radius-pill); background: var(--ink-muted); transition: transform 150ms ease-out; }
.ar-toggle[aria-checked="true"] .ar-switch { background: var(--neon-cyan); }
.ar-toggle[aria-checked="true"] .ar-switch::after { transform: translateX(20px); background: var(--on-neon); }

/* Now Playing */
.ar-now { position: absolute; inset: 0; display: grid; grid-template-columns: var(--cover-now) 1fr; gap: var(--space-6); align-items: center; padding: 0 var(--space-6) 0 var(--space-6); }
.ar-now__cover { width: var(--cover-now); height: var(--cover-now); }
.ar-now__info { display: flex; flex-direction: column; height: var(--cover-now); min-width: 0; }
.ar-now__meta { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.ar-now__kicker { display: flex; align-items: center; justify-content: space-between; color: var(--neon-cyan); margin-bottom: var(--space-1); }
.ar-now__title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ar-now__tech { color: var(--ink-muted); margin-top: var(--space-1); }
.ar-now__bottom { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-1); }

/* Reducir brillos */
.ar-calm .ar-play, .ar-calm .ar-progress__thumb { box-shadow: none; }
.ar-calm .ar-rail__item .ar-icon { filter: none !important; }

html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
#stage { width: 800px; height: 480px; flex: none; transform-origin: center; }
</style>
</head>
<body class="ar-root">

<div class="ar-app" id="app">
  <header class="ar-statusbar mono-status">
    <span class="ar-statusbar__item" id="clock">23:41</span>
    <span class="ar-statusbar__spacer"></span>

</div>

    album: function () {
      var al = S.album === '__liked' ? { title: 'Favoritas', artist: 'Tus canciones con Me gusta', tracks: [] } : ALBUMS.filter(function (a) { return a.id === S.album; })[0];
      var list = S.album === '__liked' ? TRACKS.filter(function (t) { return S.liked[t.id]; }) : TRACKS.filter(function (t) { return t.album === al; });
      var total = list.reduce(function (s, t) { return s + t.dur; }, 0);
      return '<div class="ar-screen"><div style="display:flex;gap:16px;align-items:flex-end;margin-bottom:16px">' +
        '<button class="ar-iconbtn" data-go="' + S.back + '" aria-label="Volver" style="align-self:flex-start;margin:-6px 0 0 -10px">' + A.icon('back') + '</button>' +
        '<div class="ar-art ar-chamfer" style="width:120px;height:120px" data-art="' + esc(al.title) + '"></div>' +
        '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="label" style="color:var(--neon-cyan)">' + (S.album === '__liked' ? 'Playlist' : 'Álbum') + '</span>' +
        '<h1 class="title-lg ar-ellipsis" style="margin:0">' + esc(al.title) + '</h1><span class="body ar-muted ar-ellipsis">' + esc(al.artist) + ' · ' + list.length + ' canciones · ' + Math.round(total / 60) + ' min</span></div>' +
        '<button class="ar-btn ar-chamfer-sm label" data-playall="' + list.map(function (t) { return t.id; }).join(',') + '">' + A.icon('play', 18) + 'Reproducir</button></div>' +
        list.map(function (t) { return trackRow(t, { ctx: list.map(function (x) { return x.id; }).join(',') }); }).join('') + '</div>';
    },
    queue: function () {
      var next = S.queue.slice(S.qi + 1).map(function (id) { return byId[id]; });
      return '<div class="ar-screen"><div class="ar-screen__head"><h1 class="title-lg" style="margin:0">Cola</h1></div>' +
        '<div class="ar-section label">Sonando ahora</div>' + trackRow(cur()) +
        '<div class="ar-section label">A continuación · ' + next.length + '</div>' +
        (next.length ? next.map(function (t) { return trackRow(t); }).join('') : '<p class="body ar-muted">No hay más canciones en la cola.</p>') + '</div>';
    },
    settings: function () {
      function tg(key, title, sub) { return '<button class="ar-toggle" role="switch" data-toggle="' + key + '" aria-checked="' + S[key] + '"><span class="ar-toggle__text"><span class="body">' + title + '</span><span class="body-sm ar-muted">' + sub + '</span></span><span class="ar-switch"></span></button>'; }
      return '<div class="ar-screen"><div class="ar-screen__head"><h1 class="title-lg" style="margin:0">Ajustes</h1></div>' +
        '<div class="ar-section label">Pantalla</div>' +
        tg('viz', 'Visualizador', 'Ecualizador animado en la canción que suena') +
        tg('calm', 'Reducir brillos', 'Quita los glow neón para ahorrar batería y GPU') +
        '<div class="ar-section label">Servidor</div>' +
        '<div class="ar-toggle" style="cursor:default"><span style="color:var(--signal-ok)">' + A.icon('server') + '</span><span class="ar-toggle__text"><span class="body">arpegiod · 127.0.0.1:7700</span><span class="body-sm ar-muted">Conectado · ' + TRACKS.length + ' canciones · última indexación hace 2 h</span></span>' +
        '<button class="ar-btn ar-btn--ghost ar-chamfer-sm label">Reescanear</button></div></div>';
    }
  };

  /* ---------- Render ---------- */
  var main = $('#main'), app = $('#app');
  function render() {
    main.innerHTML = SCREENS[S.screen]();
    A.hydrate(main);
    var railKey = S.screen === 'album' ? S.back : S.screen;
    document.querySelectorAll('.ar-rail__item').forEach(function (b) { b.toggleAttribute('aria-current', b.getAttribute('data-go') === railKey); if (b.hasAttribute('aria-current')) b.setAttribute('aria-current', 'page'); });
    $('#mini').style.display = S.screen === 'now' ? 'none' : '';
    app.classList.toggle('ar-calm', S.calm);
    var t = cur();
    $('#miniArt').innerHTML = A.art(t.album.title);
    $('#miniTitle').textContent = t.title; $('#miniArtist').textContent = t.album.artist;
    paintPlay(); tick(true);
    var q = $('#q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  function paintPlay() { document.querySelectorAll('[data-playicon]').forEach(function (i) { i.innerHTML = A.icon(S.playing ? 'pause' : 'play', +i.getAttribute('data-size') || 24); }); }
  function tick(only) {
    var t = cur(), p = Math.min(100, S.pos / t.dur * 100) + '%';
    document.querySelectorAll('[data-prog]').forEach(function (e) { e.style.setProperty('--p', p); });
    document.querySelectorAll('[data-time]').forEach(function (e) { e.textContent = A.time(S.pos); });
  }

  function go(screen) { if (screen !== 'album' && screen !== 'now') S.back = screen; S.screen = screen; render(); var sc = $('.ar-screen'); if (sc) sc.scrollTop = 0; }
  function playIndex(i) { S.qi = i; S.pos = 0; S.playing = true; render(); }
  function next(auto) {
    if (auto && S.repeat === 2) { S.pos = 0; return render(); }
    if (S.shuffle) return playIndex(Math.floor(Math.random() * S.queue.length));
    if (S.qi < S.queue.length - 1) return playIndex(S.qi + 1);
    if (S.repeat === 1 || !auto) return playIndex(0);
    S.playing = false; S.pos = 0; render();
  }
  function prev() { if (S.pos > 3) { S.pos = 0; tick(); } else playIndex(Math.max(0, S.qi - 1)); }
  function playList(ids, id) { S.queue = ids; playIndex(Math.max(0, ids.indexOf(id))); }

  setInterval(function () {
    var c = new Date(); $('#clock').textContent = (c.getHours() < 10 ? '0' : '') + c.getHours() + ':' + (c.getMinutes() < 10 ? '0' : '') + c.getMinutes();
    if (!S.playing) return;
    S.pos += 1; if (S.pos >= cur().dur) next(true); else tick();
  }, 1000);

  /* ---------- Eventos ---------- */
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-like],[data-go],[data-act],[data-play],[data-album],[data-chip],[data-toggle],[data-playall]');
    if (!el || !app.contains(el)) return;
    if (el.hasAttribute('data-like')) { e.stopPropagation(); var id = el.getAttribute('data-like'); if (S.liked[id]) delete S.liked[id]; else S.liked[id] = 1; return render(); }
    if (el.hasAttribute('data-go')) return go(el.getAttribute('data-go'));
    if (el.hasAttribute('data-act')) {
      var a = el.getAttribute('data-act');
      if (a === 'toggle') { S.playing = !S.playing; return render(); }
      if (a === 'next') return next(false);
      if (a === 'prev') return prev();
      if (a === 'shuffle') { S.shuffle = !S.shuffle; return render(); }
      if (a === 'repeat') { S.repeat = (S.repeat + 1) % 3; return render(); }
    }
    if (el.hasAttribute('data-play')) {
      var tid = el.getAttribute('data-play');
      if (cur().id === tid) return go('now');
      var ctx = el.getAttribute('data-ctx');
      if (ctx) return playList(ctx.split(','), tid);
      var qi = S.queue.indexOf(tid);
      if (qi >= 0) return playIndex(qi);
      S.queue.splice(S.qi + 1, 0, tid); return playIndex(S.qi + 1);
    }
    if (el.hasAttribute('data-playall')) { var ids = el.getAttribute('data-playall').split(','); if (ids[0]) playList(ids, ids[0]); return go('now'); }
    if (el.hasAttribute('data-album')) { S.album = el.getAttribute('data-album'); return go('album'); }
    if (el.hasAttribute('data-chip')) { var kv = el.getAttribute('data-chip').split(':'); S[kv[0]] = kv[1]; return render(); }
    if (el.hasAttribute('data-toggle')) { var k = el.getAttribute('data-toggle'); S[k] = !S[k]; return render(); }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id !== 'q') return;
    S.query = e.target.value; var tmp = document.createElement('div'); tmp.innerHTML = SCREENS.search();
    $('#results').innerHTML = $('#results', tmp).innerHTML; A.hydrate($('#results'));
  });
  app.addEventListener('pointerdown', function (e) {
    var tr = e.target.closest('[data-seek]'); if (!tr) return;
    function seek(ev) { var r = tr.getBoundingClientRect(); S.pos = Math.round(Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)) * cur().dur); tick(); }
    tr.setPointerCapture(e.pointerId); seek(e);
    tr.onpointermove = seek; tr.onpointerup = function () { tr.onpointermove = null; };
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.key === ' ') { e.preventDefault(); S.playing = !S.playing; render(); }
    else if (e.key === 'ArrowRight') next(false);
    else if (e.key === 'ArrowLeft') prev();
    else if (/^[1-6]$/.test(e.key)) e.preventDefault(), go(['now', 'home', 'search', 'library', 'queue', 'settings'][+e.key - 1]);
  });

  A.hydrate(document);
  render();
})();

(function () {
  var st = document.getElementById('stage');
  function fit() { var s = Math.min(innerWidth / 800, innerHeight / 480); st.style.transform = s === 1 ? '' : 'scale(' + s + ')'; }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
